# render.yaml
services:
  - type: web
    name: shifpita-mvp
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && flask db upgrade"
    startCommand: "gunicorn --timeout 600 run:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shifpita-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: run.py
      - key: FLASK_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "3"
databases:
  - name: shifpita-db
    databaseName: shifpita_db
    user: shifpita_user
    plan: free
