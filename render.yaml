# render.yaml
services:
  - type: web
    name: shifpita-mvp
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -u wait-for-db.py && flask db upgrade && flask seed"
    startCommand: "gunicorn -c gunicorn_config.py"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: run.py
      - key: FLASK_DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "3"
