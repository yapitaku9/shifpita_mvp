<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シフぴた MVP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">シフぴた MVP</span>
        </div>
    </nav>

    <div class="container" id="app">
        <!-- 1. 期間設定 -->
        <div class="card mb-4">
            <div class="card-header">1. 対象年月設定</div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-auto">
                        <input type="number" id="yearInput" class="form-control" value="2026">
                    </div>
                    <div class="col-auto align-self-center">年</div>
                    <div class="col-auto">
                        <select id="monthInput" class="form-select">
                            <option value="10" selected>10</option>
                            <!-- JSで生成してもよいが簡易的に -->
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                            <option value="7">7</option>
                            <option value="8">8</option>
                            <option value="9">9</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                    </div>
                    <div class="col-auto align-self-center">月</div>
                </div>
            </div>
        </div>

        <!-- 2. 従業員管理 -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                2. 従業員リスト
                <button class="btn btn-sm btn-success" onclick="addEmployee()">+ 追加</button>
            </div>
            <div class="card-body">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>名前</th>
                            <th>役割</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="employeeTableBody">
                        <!-- JSで描画 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. 希望休設定 -->
        <div class="card mb-4">
            <div class="card-header">3. 希望休設定 (名前をクリックして選択)</div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="currentEmployeeSelect" class="form-label">対象従業員:</label>
                    <select id="currentEmployeeSelect" class="form-select" onchange="renderCalendar()">
                        <!-- JSで描画 -->
                    </select>
                </div>
                <div id="calendarArea" class="calendar-grid">
                    <!-- JSでカレンダー描画 -->
                </div>
                <div class="mt-2 text-muted small">※日付をクリックすると「希望休」のON/OFFが切り替わります。</div>
            </div>
        </div>

        <!-- 4. アクション -->
        <div class="d-grid gap-2 mb-5">
            <button class="btn btn-primary btn-lg" id="generateBtn" onclick="generateShifts()">
                シフトを自動作成する
            </button>
        </div>

        <!-- 5. 結果表示・ダウンロード -->
        <div id="resultArea" class="card mb-5 d-none">
            <div class="card-header bg-success text-white">作成完了</div>
            <div class="card-body text-center">
                <h5 class="card-title">シフトが正常に作成されました！</h5>
                <p class="card-text">以下のボタンからPDFをダウンロードしてください。</p>
                <button class="btn btn-outline-dark" onclick="downloadPDF()">
                    PDFをダウンロード
                </button>
            </div>
            <div class="card-footer">
                <h6>プレビュー (簡易)</h6>
                <div class="table-responsive">
                    <table class="table table-sm table-bordered" id="previewTable">
                        <!-- JSでプレビュー描画 -->
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <div class="spinner-border text-primary mb-3" role="status"></div>
                <h5>シフト計算中...</h5>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
