{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>{{ title }}</h2>

    <div class="card">
        <div class="card-header fw-bold">
            確定済みシフト履歴
        </div>
        <div class="card-body">
            {% if shifts_list %}
            <table class="table table-striped table-hover">
                <thead class="table-light">
                    <tr>
                        <th>対象年月</th>
                        <th class="text-center">ダウンロード</th>
                        <th class="text-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for shift in shifts_list %}
                    <tr>
                        <td>
                            <span class="fw-bold">{{ shift.year }}年{{ shift.month }}月</span>
                        </td>
                        <td class="text-center">
                            <a href="{{ url_for('admin.download_confirmed_pdf', year=shift.year, month=shift.month) }}" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-file-earmark-pdf"></i> PDF
                            </a>
                            <a href="{{ url_for('admin.download_excel', year=shift.year, month=shift.month) }}" class="btn btn-sm btn-outline-success">
                                <i class="bi bi-file-earmark-excel"></i> Excel
                            </a>
                        </td>
                        <td class="text-center">
                            <form action="{{ url_for('admin.delete_confirmed_shift', year=shift.year, month=shift.month) }}" method="POST" class="d-inline" onsubmit="return confirm('本当に{{ shift.year }}年{{ shift.month }}月の確定済みシフトを削除しますか？\n関連するPDFファイルも全て削除され、元に戻すことはできません。');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i> 削除
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% else %}
                <p class="text-center text-muted my-3">確定済みのシフト履歴はありません。</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
