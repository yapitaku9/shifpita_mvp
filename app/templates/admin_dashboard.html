{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1>{{ title }}</h1>
    <p class="lead">ようこそ、{{ current_user.username }} さん。</p>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    主な機能
                </div>
                <div class="list-group list-group-flush">
                    <a href="{{ url_for('admin.manage_users') }}" class="list-group-item list-group-item-action">
                        <h6 class="mb-1">従業員管理</h6>
                        <small>従業員の追加、一覧、編集を行います。</small>
                    </a>
                    <div class="list-group-item">
                        <h6 class="mb-1">シフト自動作成</h6>
                        <form action="{{ url_for('admin.generate_shifts') }}" method="POST" class="row g-2 align-items-center">
                            <div class="col-auto">
                                <input type="number" name="year" class="form-control form-control-sm" value="2026">
                            </div>
                            <div class="col-auto">
                                <input type="number" name="month" class="form-control form-control-sm" value="10">
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-sm btn-primary">生成実行</button>
                            </div>
                        </form>
                    </div>
                    <a href="#" class="list_group-item list-group-item-action disabled" tabindex="-1" aria-disabled="true">
                        <h6 class="mb-1">シフト作成履歴</h6>
                        <small>過去に作成したシフトを確認します。（実装中）</small>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
